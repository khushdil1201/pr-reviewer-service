run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert
    - unparam
    - gosec
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - wastedassign
linters-settings:
  errcheck:
    check-blank: true
    check-type-assertions: true
  
  # govet:
  #   check-shadowing: true
  
  revive:
    rules:
      - name: exported
        disabled: true
      - name: error-return
      - name: error-naming
      - name: if-return
      - name: var-naming
      - name: unexported-return
      - name: errorf
      - name: context-as-argument
      - name: context-keys-type

  gosec:
    excludes:
      - G404

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
